[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lora-audit-research"
version = "0.1.0"
description = "Reproducible LoRA adapter backdoor-audit research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Research-only; no public malicious artifacts"}
authors = [{name = "Research project"}]
dependencies = [
  "jsonschema==4.26.0",
  "matplotlib==3.10.1",
  "numpy==2.5.1",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "typer==0.26.8",
]

[project.optional-dependencies]
accelerated = [
  "accelerate==1.14.0",
  "datasets==5.0.0",
  "fsspec==2026.4.0",
  "huggingface-hub==1.23.0",
  "pandas==3.0.3",
  "peft==0.19.1",
  "pyarrow==25.0.0",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
  "torch==2.13.0",
  "transformers==5.13.1",
]
dev = [
  "ipykernel==7.3.0",
  "nbclient==0.11.0",
  "nbformat==5.10.4",
  "pytest==9.1.1",
  "ruff==0.15.21",
  "torch==2.13.0",
]

[project.scripts]
lora-audit = "lora_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lora_audit"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
